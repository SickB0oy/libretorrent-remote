name: Build LibreTorrent Remote APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-remote
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up signing key
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::Secrets KEYSTORE_BASE64 / KEYSTORE_PASSWORD manquants : compilation de test uniquement, APK non signé et non publié."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
          mkdir -p signing
          echo "$KEYSTORE_BASE64" | base64 -d > signing/remote.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=libretorrent-remote"
            echo "storeFile=signing/remote.jks"
          } > key.properties

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace assembleBaseRelease

      - name: Collect APKs
        id: apk
        run: |
          mkdir -p out
          find app/build/outputs/apk/base/release -name '*.apk' -exec cp {} out/ \;
          ls -la out
          universal=$(ls out/*universal*.apk | head -n1)
          [ -n "$universal" ] || { echo "::error::APK universel introuvable"; exit 1; }
          cp "$universal" out/LibreTorrent-Remote.apk
          echo "version=$(grep -oP "versionName '\K[^']+" app/build.gradle)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: LibreTorrent-Remote-apk
          path: out/*.apk

      - name: Publish release
        if: steps.sign.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LibreTorrent Remote ${{ steps.apk.outputs.version }} (build ${{ github.run_number }})
          body: |
            APK à installer sur la TV : **LibreTorrent-Remote.apk** (compatible avec toutes les TV).
            Lien direct, toujours vers la dernière version :
            https://github.com/${{ github.repository }}/releases/latest/download/LibreTorrent-Remote.apk
          files: out/LibreTorrent-Remote.apk
          make_latest: true
